name: rosary_break
description: "Five breaks. Five decades. One Rosary. A campus-wide daily Rosary campaign."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  cloud_firestore: ^6.10.0
  connectivity_plus: ^7.0.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^19.4.0
  flutter_timezone: ^4.1.1
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.5
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/env/.env
    - assets/yellow svg.svg
    - assets/jy-logo black.png
